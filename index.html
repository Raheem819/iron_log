<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>IRONLOG — Home Gym Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   IRONLOG — Design tokens
   Direction: industrial iron/concrete workshop. Dark charcoal
   base, brass accent (progress, primary actions), ember accent
   (alerts / increase-weight moments). Plate-ring motif used for
   progress indicators, echoing the actual rubber plates owned.
   ============================================================ */
:root{
  --ink:#131417;
  --ink-2:#1c1e23;
  --ink-3:#25272e;
  --paper:#eeece5;
  --paper-2:#ffffff;
  --paper-3:#e2dfd5;
  --steel:#8a8d96;
  --steel-dim:#5c5e66;
  --brass:#e0a526;
  --brass-dim:#a97e22;
  --ember:#c1440e;
  --good:#4f9d69;
  --line-dark:#2c2e35;
  --line-light:#d9d6cb;

  --bg:var(--ink);
  --surface:var(--ink-2);
  --surface-2:var(--ink-3);
  --text:#f1efe9;
  --text-dim:var(--steel);
  --line:var(--line-dark);
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:var(--paper);
  --surface:var(--paper-2);
  --surface-2:var(--paper-3);
  --text:#1a1a1c;
  --text-dim:var(--steel-dim);
  --line:var(--line-light);
  --shadow: 0 10px 24px rgba(30,25,15,.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Work Sans',sans-serif; font-size:15px; line-height:1.5;
  transition:background .25s ease, color .25s ease;
  overscroll-behavior-y:none;
}
h1,h2,h3,.display{
  font-family:'Big Shoulders Display',sans-serif; font-weight:800;
  text-transform:uppercase; letter-spacing:.02em; margin:0;
}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}
::selection{background:var(--brass); color:#131417;}

#app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}

/* ---------- Topbar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px 10px; position:sticky; top:0; z-index:20;
  background:var(--bg); border-bottom:1px solid transparent;
}
.brand{display:flex; align-items:center; gap:9px;}
.brand-mark{width:26px; height:26px; border-radius:3px; background:linear-gradient(155deg,var(--brass),var(--brass-dim)); position:relative; flex:none;}
.brand-mark::before{content:""; position:absolute; inset:6px; border:2px solid var(--ink); border-radius:1px;}
.brand-name{font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:19px; letter-spacing:.04em;}
.topbar-actions{display:flex; gap:8px;}
.icon-btn{
  width:36px; height:36px; border-radius:50%; border:1px solid var(--line);
  background:var(--surface); display:flex; align-items:center; justify-content:center;
  color:var(--text); transition:transform .15s ease, border-color .15s ease;
}
.icon-btn:active{transform:scale(.9);}
.icon-btn svg{width:17px; height:17px;}

/* ---------- Main scroll area ---------- */
#screen-root{flex:1; padding:6px 18px 100px; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:sticky; bottom:0; z-index:20;
  display:grid; grid-template-columns:repeat(5,1fr);
  background:var(--surface); border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.nav-btn{
  background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:6px 2px; color:var(--text-dim); font-size:10px; font-weight:600; letter-spacing:.03em;
  text-transform:uppercase; border-radius:10px; transition:color .15s ease;
}
.nav-btn svg{width:20px; height:20px;}
.nav-btn.active{color:var(--brass);}

/* ---------- Cards / primitives ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:18px; margin-bottom:14px; box-shadow:var(--shadow);
}
.card-flat{background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:14px;}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--brass);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; border-radius:12px; padding:14px 20px; font-weight:700; font-size:14px;
  letter-spacing:.02em; text-transform:uppercase; width:100%; transition:transform .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--brass); color:#181008;}
.btn-ghost{background:transparent; color:var(--text); border:1px solid var(--line);}
.btn-ember{background:var(--ember); color:#fff0e8;}
.btn-sm{padding:9px 14px; font-size:12px; width:auto;}
input,select,textarea{
  font-family:inherit; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
  border-radius:10px; padding:11px 12px; font-size:14px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brass); outline-offset:1px;}
label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
.field{margin-bottom:14px;}
.row{display:flex; gap:10px;}
.row > *{flex:1;}
hr.rule{border:none; border-top:1px solid var(--line); margin:16px 0;}

/* ---------- Plate ring (signature element) ---------- */
.plate-ring{position:relative; width:132px; height:132px; margin:0 auto;}
.plate-ring svg{transform:rotate(-90deg);}
.plate-ring .ring-bg{fill:none; stroke:var(--surface-2); stroke-width:10;}
.plate-ring .ring-fg{fill:none; stroke:var(--brass); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .6s ease;}
.plate-ring-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.plate-ring-label .big{font-family:'Big Shoulders Display'; font-weight:900; font-size:30px; line-height:1;}
.plate-ring-label .small{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-top:2px;}

/* ---------- Home ---------- */
.hero{padding:22px 18px;}
.hero .eyebrow{margin-bottom:6px;}
.hero h1{font-size:30px; line-height:1;}
.hero-meta{color:var(--text-dim); font-size:13px; margin-top:6px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:14px;}
.stat{background:var(--surface-2); border-radius:12px; padding:10px 8px; text-align:center;}
.stat .num{font-family:'IBM Plex Mono'; font-size:19px; font-weight:600;}
.stat .lab{font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}
.deload-banner{background:var(--ember); color:#fff0e8; border-radius:12px; padding:10px 14px; font-size:12.5px; font-weight:600; margin-bottom:14px;}

/* ---------- Exercise card ---------- */
.exercise{border:1px solid var(--line); border-radius:14px; margin-bottom:12px; background:var(--surface); overflow:hidden;}
.exercise-head{display:flex; align-items:center; justify-content:space-between; padding:14px 15px; gap:10px;}
.exercise-idx{font-family:'IBM Plex Mono'; font-size:12px; color:var(--brass); font-weight:600; flex:none; width:20px;}
.exercise-name{font-weight:700; font-size:15px; flex:1;}
.exercise-target{font-family:'IBM Plex Mono'; font-size:12px; color:var(--text-dim);}
.chev{width:16px; height:16px; color:var(--text-dim); transition:transform .2s ease; flex:none;}
.exercise.open .chev{transform:rotate(180deg);}
.exercise-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.exercise.open .exercise-body{max-height:900px;}
.exercise-body-inner{padding:0 15px 16px;}
.cue{font-size:13px; color:var(--text-dim); margin-bottom:12px; line-height:1.5;}
.detail-toggle{font-size:12px; font-weight:700; color:var(--brass); background:none; border:none; padding:0; margin-bottom:10px; text-transform:uppercase; letter-spacing:.03em;}
.detail-text{font-size:13px; color:var(--text-dim); line-height:1.6; margin:0 0 12px; display:none; border-left:2px solid var(--brass); padding-left:10px;}
.detail-text.show{display:block;}
.set-row{display:grid; grid-template-columns:32px 1fr 1fr; gap:8px; align-items:center; margin-bottom:8px;}
.set-row .set-num{font-family:'IBM Plex Mono'; font-size:12px; color:var(--text-dim); text-align:center;}
.set-row input{text-align:center; padding:9px 6px;}
.weight-editor{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
.weight-editor input{text-align:center; font-family:'IBM Plex Mono'; font-weight:600;}
.stepper{width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); color:var(--text); font-size:16px; flex:none;}
.exercise-actions{display:flex; gap:8px;}
.video-btn{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--text); background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:9px 12px;}
.video-btn svg{width:14px; height:14px; color:var(--ember);}
.suggest-badge{background:rgba(224,165,38,.14); border:1px solid var(--brass-dim); color:var(--brass); font-size:11.5px; font-weight:700; padding:8px 10px; border-radius:9px; margin-bottom:12px;}

/* ---------- Timer overlay ---------- */
.timer-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:40; max-width:480px; margin:0 auto;
  background:var(--brass); color:#181008; padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  transform:translateY(110%); transition:transform .25s ease;
}
.timer-bar.show{transform:translateY(0);}
.timer-bar .t-num{font-family:'IBM Plex Mono'; font-weight:700; font-size:22px;}
.timer-bar .t-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
.timer-bar button{background:#181008; color:#f1efe9; border:none; border-radius:8px; padding:8px 12px; font-size:11px; font-weight:700; text-transform:uppercase;}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(10,9,7,.6); z-index:50; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease;}
.modal-backdrop.show{opacity:1; pointer-events:auto;}
.modal-sheet{
  background:var(--bg); width:100%; max-width:480px; max-height:86vh; overflow-y:auto;
  border-radius:20px 20px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%); transition:transform .25s ease; border-top:1px solid var(--line);
}
.modal-backdrop.show .modal-sheet{transform:translateY(0);}
.modal-handle{width:36px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 16px;}
.modal-close{position:absolute; top:16px; right:18px; color:var(--text-dim); background:none; border:none; font-size:20px;}

/* ---------- History list ---------- */
.hist-item{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--line);}
.hist-item:last-child{border-bottom:none;}
.hist-day{font-weight:700; font-size:14px;}
.hist-date{font-size:11.5px; color:var(--text-dim); font-family:'IBM Plex Mono';}
.pill{font-size:10px; font-weight:700; text-transform:uppercase; padding:4px 9px; border-radius:20px; background:var(--surface-2); color:var(--text-dim);}
.pill.done{background:rgba(79,157,105,.15); color:var(--good);}

/* ---------- Progress table ---------- */
.spark{width:100%; height:70px; margin:10px 0 4px;}
.spark path{fill:none; stroke:var(--brass); stroke-width:2.2;}
.spark circle{fill:var(--brass);}

/* ---------- Settings ---------- */
.settings-row{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--line); gap:12px;}
.settings-row:last-child{border-bottom:none;}
.settings-row .lab{font-weight:600; font-size:13.5px;}
.settings-row .sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
.toggle{width:46px; height:26px; border-radius:20px; background:var(--surface-2); border:1px solid var(--line); position:relative; flex:none;}
.toggle::after{content:""; position:absolute; width:20px; height:20px; border-radius:50%; background:var(--text-dim); top:2px; left:2px; transition:transform .2s ease, background .2s ease;}
.toggle.on{border-color:var(--brass);}
.toggle.on::after{transform:translateX(20px); background:var(--brass);}
.status-dot{width:8px; height:8px; border-radius:50%; background:var(--steel-dim); display:inline-block; margin-right:6px;}
.status-dot.connected{background:var(--good);}
.warn-box{background:rgba(193,68,14,.12); border:1px solid var(--ember); border-radius:12px; padding:12px 14px; font-size:12.5px; line-height:1.5; margin-bottom:16px;}
.exercise-weight-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); gap:10px;}
.exercise-weight-row .name{font-size:13px; font-weight:600; flex:1;}
.exercise-weight-row input{width:76px; text-align:center; font-family:'IBM Plex Mono'; padding:8px;}

/* ---------- Empty state ---------- */
.empty{text-align:center; padding:36px 10px; color:var(--text-dim);}
.empty svg{width:34px; height:34px; margin-bottom:10px; opacity:.5;}

/* ---------- Toast ---------- */
#toast{position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-60px); z-index:60; background:var(--surface); border:1px solid var(--brass); color:var(--text); padding:10px 18px; border-radius:30px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow); transition:transform .3s ease; max-width:90%; text-align:center;}
#toast.show{transform:translateX(-50%) translateY(0);}

@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important;}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark"></div><div class="brand-name">IRONLOG</div></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-guide" aria-label="Rules and diet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg></button>
      <button class="icon-btn" id="btn-theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path id="theme-icon-path" d="M12 3v1M12 20v1M4.2 4.2l.7.7M19.1 19.1l.7.7M3 12h1M20 12h1M4.2 19.8l.7-.7M19.1 4.9l.7-.7"/><circle cx="12" cy="12" r="5"/></svg></button>
    </div>
  </header>

  <main id="screen-root"></main>

  <nav class="bottomnav">
    <button class="nav-btn" data-screen="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button class="nav-btn" data-screen="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8v8M20 8v8M2 10v4M22 10v4M7 12h10"/></svg>Train</button>
    <button class="nav-btn" data-screen="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9M12 19V5M20 19v-6"/></svg>Progress</button>
    <button class="nav-btn" data-screen="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>History</button>
    <button class="nav-btn" data-screen="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Settings</button>
  </nav>
</div>

<div class="modal-backdrop" id="modal-backdrop"><div class="modal-sheet" id="modal-sheet"></div></div>
<div class="timer-bar" id="timer-bar">
  <div><div class="t-label">Rest</div><div class="t-num" id="timer-num">01:30</div></div>
  <div style="display:flex; gap:8px;">
    <button id="timer-add">+15s</button>
    <button id="timer-skip">Skip</button>
  </div>
</div>
<div id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* =========================================================================
   IRONLOG — configuration
   Paste your own Google OAuth Client ID below once you've completed the
   Google Cloud setup (see the setup guide). Everything else works fully
   without it — Drive/Sheets sync is the only feature that needs it.
   ========================================================================= */
const CONFIG = {
  GOOGLE_CLIENT_ID: "686897623039-rp8t7e9umihfnddidc4uk80uva0p6mie.apps.googleusercontent.com",
  SHEETS_SCOPE: "https://www.googleapis.com/auth/drive.file"
};

/* =========================================================================
   IRONLOG — app logic
   ========================================================================= */

/* ---------------------- Exercise move library ---------------------- */
/* cue = short line shown by default. detail = longer form guidance shown
   when "Read full instructions" is expanded. video = YouTube search query. */
const MOVES = {
  goblet_squat:{name:"Goblet Squat", equip:"dumbbell",
    cue:"Hold the dumbbell at your chest. Squat until thighs are parallel, then drive up through your heels.",
    detail:"Stand with feet shoulder-width apart, toes turned out slightly. Hold one dumbbell vertically against your chest, both hands cupping the top plate. Keep your chest tall as you push your hips back and bend your knees, lowering until your thighs are roughly parallel to the floor. Drive through your heels to stand, squeezing your glutes at the top. Knees should track over your toes, not cave inward.",
    video:"goblet squat proper form"},
  db_bench_press:{name:"Dumbbell Bench Press", equip:"dumbbell",
    cue:"Elbows at 45° to your body. Lower to chest level, press up without locking elbows.",
    detail:"Lie on the flat bench with a dumbbell in each hand at chest level, palms facing your feet. Feet flat on the floor for stability. Lower the dumbbells slowly until you feel a stretch across your chest, elbows at roughly 45 degrees from your torso — not flared to 90. Press back up, stopping just short of locking your elbows out. Keep your shoulder blades pulled together into the bench throughout.",
    video:"dumbbell bench press form"},
  bent_row:{name:"Bent-over Barbell Row", equip:"barbell",
    cue:"Hinge at hips, back flat. Pull the bar to your lower stomach, squeeze, lower slow.",
    detail:"Stand with feet hip-width apart, hinge forward from the hips to about 45 degrees with a flat back and slight knee bend. Let the bar hang at arm's length. Pull it up towards your lower stomach/belly button, driving your elbows back and squeezing your shoulder blades together at the top. Lower under control. Avoid jerking the weight up with your lower back.",
    video:"barbell bent over row form"},
  incline_pushup:{name:"Incline Push-up", equip:"bodyweight",
    cue:"Hands on the bench edge, body straight. Lower chest to the bench, push back up.",
    detail:"Place both hands on the bench edge slightly wider than shoulder width, walk your feet back so your body forms a straight line from head to heels. Lower your chest towards the bench by bending your elbows, keeping your core tight so your hips don't sag. Push back up to the start. The higher the incline, the easier the move — you can lower the bench angle over time as you get stronger.",
    video:"incline push up correct form"},
  plank:{name:"Plank", equip:"bodyweight",
    cue:"Forearms down, straight line head to heels. Squeeze your core, don't let hips sag or pike.",
    detail:"Rest on your forearms with elbows under your shoulders, legs extended back with toes on the floor. Keep your body in one straight line — squeeze your glutes and brace your abs as if about to be punched, to stop your hips sagging or lifting too high. Breathe normally, don't hold your breath.",
    video:"plank correct form"},
  rdl:{name:"Romanian Deadlift", equip:"barbell",
    cue:"Soft knees, push hips back, bar stays close to your legs. Feel it in your hamstrings, not your back.",
    detail:"Hold the bar at hip level with an overhand grip, feet hip-width apart, knees softly bent. Push your hips straight back while keeping the bar sliding down close to your thighs and shins, chest staying up. Lower until you feel a strong stretch in your hamstrings — usually mid-shin height, not necessarily the floor. Drive your hips forward to return to standing. Your back should stay flat throughout, never rounding.",
    video:"romanian deadlift form"},
  seated_shoulder_press:{name:"Seated DB Shoulder Press", equip:"dumbbell",
    cue:"Bench upright, back supported. Press dumbbells overhead without arching your lower back.",
    detail:"Sit on the bench with the backrest upright, a dumbbell in each hand at shoulder height, palms facing forward. Press both dumbbells straight overhead until your arms are extended but not locked, then lower back to shoulder height under control. Keep your ribcage down and avoid arching your lower back to get the weight up — if you have to arch hard, the weight is too heavy.",
    video:"seated dumbbell shoulder press form"},
  stepup:{name:"Dumbbell Step-up", equip:"dumbbell",
    cue:"Step fully onto the bench, drive through the front heel, control the way down.",
    detail:"Stand facing the bench holding a dumbbell in each hand. Place one foot fully flat on the bench and drive through that heel to stand up on top of it, letting the trailing leg follow naturally without pushing off the floor. Step back down with control. Complete all reps on one leg before switching, or alternate — either works.",
    video:"dumbbell step up form"},
  glute_bridge:{name:"Glute Bridge", equip:"bodyweight",
    cue:"Feet flat, drive hips up by squeezing glutes, hold briefly at the top.",

/* ---------------------- Program structure ---------------------- */
/* Each day references a move key plus context (sets, rep range, starting
   weight, equipment increment). weight is null for bodyweight moves. */
function ex(key, sets, repMin, repMax, weight, increment, note){
  return {key, sets, repMin, repMax, weight, increment: increment===undefined?null:increment, note: note||""};
}
function targetLabel(exo, setCount){
  const n = setCount!==undefined ? setCount : exo.sets;
  const range = exo.repMin===exo.repMax ? (exo.repMin+(exo.repMin>30?"s":" reps")) : (exo.repMin+"-"+exo.repMax+" reps");
  return `${n}x${range}`;
}

/* ---------------------- State ---------------------- */
const STORAGE_KEY = "ironlog_state_v1";

function defaultState(){
  return {
    name:"",
    theme:"dark",
    phase:"foundation",        // "foundation" | "main"
    sessionIndex:0,             // pointer into current phase's order[]
    completedCount:{foundation:0, main:0},
    weights:{},                  // exerciseKey -> current weight override
    sessions:[],                  // completed workout log entries
    bodyLogs:[],                   // body progress entries
    google:{connected:false, email:null, sheetId:null, token:null, tokenExpiresAt:null, needsReauth:false}
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){
    return defaultState();
  }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn("Local save failed", e); }
}

/* ---------------------- Rotation / program helpers ---------------------- */
function currentDayKey(){
  const prog = PROGRAM[state.phase];
  const idx = state.sessionIndex % prog.order.length;
  return prog.order[idx];
}
function currentDay(){
  const key = currentDayKey();
  return Object.assign({key}, PROGRAM[state.phase].days[key]);
}
function currentWeekNumber(){
  // Only meaningful in main phase (5-session week)
  return Math.floor(state.completedCount.main / 5) + 1;
}
function isDeloadWeek(){
  if(state.phase !== "main") return false;
  return currentWeekNumber() % 4 === 0;
}
function exerciseWeight(exObj){
  if(exObj.weight === null) return null;
  if(state.weights[exObj.key] !== undefined) return state.weights[exObj.key];
  return exObj.weight;
}
function restSeconds(exObj){
  const move = MOVES[exObj.key];
  return (move.equip === "bodyweight") ? 60 : (exObj.repMax <= 12 && exObj.sets >=3 ? 90 : 60);
}

/* ---------------------- Rendering ---------------------- */
const root = document.getElementById("screen-root");
let activeScreen = "home";
let workoutDraft = null; // { dayKey, entries:{ [exKey]: {reps:[...], weight} } }
let openExerciseKey = null;

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

function setScreen(name){
  activeScreen = name;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active", b.dataset.screen===name));
  render();
}

function render(){
  if(activeScreen==="home") return renderHome();
  if(activeScreen==="train") return renderTrain();
  if(activeScreen==="progress") return renderProgress();
  if(activeScreen==="history") return renderHistory();
  if(activeScreen==="settings") return renderSettings();
}

/* ---- Home ---- */
function renderHome(){
  const day = currentDay();
  const doneThisWeek = state.phase==="main" ? (state.completedCount.main % 5) : state.completedCount.foundation;
  const totalThisWeek = state.phase==="main" ? 5 : PROGRAM.foundation.order.length;
  const pct = Math.min(1, doneThisWeek/totalThisWeek);
  const circumference = 2*Math.PI*56;
  const offset = circumference*(1-pct);

  root.innerHTML = `
    <div class="card hero">
      <div class="eyebrow">${state.phase==="foundation" ? "Foundation Phase" : "Week " + currentWeekNumber()}</div>
      <h1>${day.label}</h1>
      <div class="hero-meta">${state.phase==="foundation" ? "Building movement patterns before real load" : (isDeloadWeek()? "Deload week — sets are halved, same weight" : "Main program")}</div>
      <div style="margin-top:18px;" class="plate-ring">
        <svg width="132" height="132" viewBox="0 0 132 132">
          <circle class="ring-bg" cx="66" cy="66" r="56"/>
          <circle class="ring-fg" cx="66" cy="66" r="56" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
        </svg>
        <div class="plate-ring-label">
          <div class="big mono">${doneThisWeek}/${totalThisWeek}</div>
          <div class="small">${state.phase==="foundation" ? "foundation" : "this week"}</div>
        </div>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="num mono">${state.sessions.length}</div><div class="lab">Sessions</div></div>
        <div class="stat"><div class="num mono">${streakCount()}</div><div class="lab">Day streak</div></div>
        <div class="stat"><div class="num mono">${state.phase==="foundation"?"1-2":"3+"}</div><div class="lab">Week</div></div>
      </div>
      <div style="margin-top:18px;">
        <button class="btn btn-primary" id="btn-start-workout">Start ${day.label}</button>
      </div>
    </div>
    ${isDeloadWeek() ? `<div class="deload-banner">Deload week: do half the usual sets on each exercise, same weight as last week. This lets your body catch up.</div>` : ""}
    <div class="card-flat" style="margin-bottom:14px;">
      <div class="eyebrow" style="margin-bottom:8px;">Quick rules</div>
      <div style="font-size:12.5px; color:var(--text-dim); line-height:1.7;">
        Training alone — never take barbell bench press to failure.<br>
        5 min warm-up before every session.<br>
        Rest 60-90s between sets. Sharp pain means stop.
      </div>
    </div>
  `;
  document.getElementById("btn-start-workout").onclick = ()=>{ setScreen("train"); };
}

function streakCount(){
  if(state.sessions.length===0) return 0;
  // Count consecutive calendar days with at least one session, walking back from most recent.
  const days = [...new Set(state.sessions.map(s=>s.date))].sort().reverse();
  let streak = 1;
  for(let i=0;i<days.length-1;i++){
    const a = new Date(days[i]); const b = new Date(days[i+1]);
    const diff = Math.round((a-b)/86400000);
    if(diff<=2) streak++; else break; // allow 1 rest day gap between training days
  }
  return streak;
}

/* ---- Train ---- */
function renderTrain(){
  const day = currentDay();
  if(!workoutDraft || workoutDraft.dayKey !== day.key){
    workoutDraft = {dayKey: day.key, entries:{}};
    day.list.forEach(exo=>{
      const sets = isDeloadWeek() ? Math.max(1, Math.ceil(exo.sets/2)) : exo.sets;
      workoutDraft.entries[exo.key+"_"+day.key] = {reps:new Array(sets).fill(""), weight: exerciseWeight(exo)};
    });
  }

  const cards = day.list.map((exo, i)=>{
    const move = MOVES[exo.key];
    const draftKey = exo.key+"_"+day.key;
    const draft = workoutDraft.entries[draftKey];
    const sets = draft.reps.length;
    const isOpen = openExerciseKey === draftKey;
    const weightLine = exo.weight===null ? "Bodyweight" : `${draft.weight}kg${move.equip==="dumbbell"?" / hand":""}`;

    const setRows = draft.reps.map((val,i2)=>`
      <div class="set-row">
        <div class="set-num mono">${i2+1}</div>
        <div class="mono" style="font-size:12px;color:var(--text-dim);align-self:center;">${targetLabel(exo,1).split("x")[1]} target</div>
        <input type="number" inputmode="numeric" placeholder="reps" data-draft="${draftKey}" data-set="${i2}" value="${val}">
      </div>`).join("");

    return `
    <div class="exercise ${isOpen?"open":""}" data-key="${draftKey}">
      <div class="exercise-head" data-toggle="${draftKey}">
        <div class="exercise-idx mono">${String(i+1).padStart(2,"0")}</div>
        <div class="exercise-name">${move.name}</div>
        <div class="exercise-target mono">${targetLabel(exo, sets)}</div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="exercise-body">
        <div class="exercise-body-inner">
          <div class="cue">${move.cue}</div>
          <button class="detail-toggle" data-detail="${draftKey}">Read full instructions</button>
          <p class="detail-text" id="detail-${draftKey}">${move.detail}</p>
          ${exo.note?`<div class="cue" style="opacity:.75;">${exo.note}</div>`:""}
          ${exo.weight!==null ? `
          <div class="weight-editor">
            <button class="stepper" data-wminus="${draftKey}">–</button>
            <input class="mono" type="number" inputmode="decimal" data-weight="${draftKey}" value="${draft.weight}" style="max-width:90px;">
            <span class="mono" style="font-size:12px;color:var(--text-dim);">kg${move.equip==="dumbbell"?"/hand":""}</span>
            <button class="stepper" data-wplus="${draftKey}">+</button>
          </div>` : `<div class="cue mono" style="margin-bottom:12px;">${weightLine}</div>`}
          ${setRows}
          <div class="exercise-actions" style="margin-top:10px;">
            <button class="video-btn" data-video="${move.video}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Watch form video</button>
            <button class="btn btn-ghost btn-sm" data-rest="${exo.key}">Start rest timer</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");

  root.innerHTML = `
    <div style="padding:14px 0 6px;">
      <div class="eyebrow">${state.phase==="foundation"?"Foundation":"Main Program"}</div>
      <h1 style="font-size:26px;">${day.label}</h1>
    </div>
    ${cards}
    <button class="btn btn-primary" id="btn-finish" style="margin-top:6px;">Finish Workout</button>
  `;

  root.querySelectorAll("[data-toggle]").forEach(el=>{
    el.onclick = ()=>{
      const k = el.dataset.toggle;
      openExerciseKey = (openExerciseKey===k) ? null : k;
      renderTrain();
    };
  });
  root.querySelectorAll("[data-detail]").forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const k = el.dataset.detail;
      document.getElementById("detail-"+k).classList.toggle("show");
    };
  });
  root.querySelectorAll("[data-set]").forEach(el=>{
    el.oninput = ()=>{
      const k = el.dataset.draft, i = +el.dataset.set;
      workoutDraft.entries[k].reps[i] = el.value;
    };
  });
  root.querySelectorAll("[data-weight]").forEach(el=>{
    el.oninput = ()=>{
      const k = el.dataset.weight;
      workoutDraft.entries[k].weight = parseFloat(el.value)||0;
    };
  });
  root.querySelectorAll("[data-wminus]").forEach(el=>{
    el.onclick = (e)=>{e.stopPropagation(); adjustDraftWeight(el.dataset.wminus, day, -1);};
  });
  root.querySelectorAll("[data-wplus]").forEach(el=>{
    el.onclick = (e)=>{e.stopPropagation(); adjustDraftWeight(el.dataset.wplus, day, 1);};
  });
  root.querySelectorAll("[data-video]").forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const q = encodeURIComponent(el.dataset.video);
      window.open(`https://www.youtube.com/results?search_query=${q}`, "_blank");
    };
  });
  root.querySelectorAll("[data-rest]").forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const exo = day.list.find(x=>x.key===el.dataset.rest);
      startTimer(restSeconds(exo));
    };
  });
  document.getElementById("btn-finish").onclick = ()=>finishWorkout(day);
}

function adjustDraftWeight(draftKey, day, dir){
  const exo = day.list.find(x => (x.key+"_"+day.key)===draftKey);
  const move = MOVES[exo.key];
  const inc = exo.increment || 1;
  const d = workoutDraft.entries[draftKey];
  d.weight = Math.max(0, Math.round((d.weight + dir*inc)*10)/10);
  renderTrain();
}

function finishWorkout(day){
  const date = new Date().toISOString().slice(0,10);
  const suggestions = [];
  const setRows = [];

  day.list.forEach(exo=>{
    const draftKey = exo.key+"_"+day.key;
    const draft = workoutDraft.entries[draftKey];
    const move = MOVES[exo.key];
    const reps = draft.reps.map(r=>parseInt(r)||0);
    setRows.push({exercise:move.name, target:targetLabel(exo, draft.reps.length), weight:draft.weight, reps, repMax:exo.repMax, weighted: exo.weight!==null});

    if(exo.weight!==null && reps.length>0){
      const allTop = reps.every(r=>r>=exo.repMax) && reps.every(r=>r>0);
      if(allTop){
        const newWeight = Math.round((draft.weight + (exo.increment||1))*10)/10;
        state.weights[exo.key] = newWeight;
        suggestions.push(`${move.name}: hit top of range — moved up to ${newWeight}kg for next time.`);
      } else {
        state.weights[exo.key] = draft.weight;
      }
    }
  });

  const session = {date, dayKey:day.key, dayLabel:day.label, phase:state.phase, sets:setRows};
  state.sessions.unshift(session);

  // advance rotation
  state.sessionIndex++;
  state.completedCount[state.phase]++;
  if(state.phase==="foundation" && state.completedCount.foundation >= PROGRAM.foundation.order.length){
    state.phase="main"; state.sessionIndex=0;
  }
  saveState();
  workoutDraft = null; openExerciseKey = null;

  syncSessionToSheet(session).catch(()=>{ if(state.google.connected) toast("Saved locally — Sheets sync failed, check Settings"); });

  const msg = suggestions.length ? "Workout saved. " + suggestions.join(" ") : "Workout saved. Keep at the same weight next time.";
  toast(suggestions.length ? "Nice work — weight increased on " + suggestions.length + " move(s)" : "Workout saved");
  if(suggestions.length){
    openModal(`
      <h2 style="margin-bottom:14px;">Session complete</h2>
      <p style="font-size:13.5px; color:var(--text-dim); line-height:1.7;">${suggestions.join("<br><br>")}</p>
      <button class="btn btn-primary" style="margin-top:16px;" data-close>Done</button>
    `);
  }
  setScreen("home");
}

/* ---- Timer ---- */
let timerInterval=null, timerRemaining=0;
function startTimer(seconds){
  clearInterval(timerInterval);
  timerRemaining = seconds;
  const bar = document.getElementById("timer-bar");
  bar.classList.add("show");
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timerRemaining--;
    if(timerRemaining<=0){ clearInterval(timerInterval); bar.classList.remove("show"); toast("Rest done"); return; }
    updateTimerDisplay();
  },1000);
}
function updateTimerDisplay(){
  const m = Math.floor(timerRemaining/60), s = timerRemaining%60;
  document.getElementById("timer-num").textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
document.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("timer-add").onclick = ()=>{ timerRemaining+=15; updateTimerDisplay(); };
  document.getElementById("timer-skip").onclick = ()=>{ clearInterval(timerInterval); document.getElementById("timer-bar").classList.remove("show"); };
});

      ${logs.length>1 ? `<svg class="spark" viewBox="0 0 300 70" preserveAspectRatio="none">${spark}</svg>` : `<div style="font-size:12.5px;color:var(--text-dim);margin:10px 0;">Log at least two entries to see a trend line.</div>`}
      <form id="body-form" style="margin-top:10px;">
        <div class="row">
          <div class="field"><label>Weight (kg)</label><input type="number" step="0.1" id="bf-weight" required></div>
          <div class="field"><label>Chest (in)</label><input type="number" step="0.1" id="bf-chest"></div>
        </div>
        <div class="row">
          <div class="field"><label>Waist (in)</label><input type="number" step="0.1" id="bf-waist"></div>
          <div class="field"><label>Arms (in)</label><input type="number" step="0.1" id="bf-arms"></div>
        </div>
        <div class="field"><label>Notes</label><input type="text" id="bf-notes" placeholder="optional"></div>
        <button class="btn btn-primary" type="submit">Save entry</button>
      </form>
    </div>
    <div class="card">
      <div class="eyebrow" style="margin-bottom:10px;">Entries</div>
      ${logs.length===0 ? `<div class="empty">No entries yet</div>` : [...logs].reverse().map(l=>`
        <div class="hist-item">
          <div><div class="hist-day">${l.weight}kg</div><div class="hist-date">${l.date}${l.chest?` · chest ${l.chest}in`:""}${l.waist?` · waist ${l.waist}in`:""}</div></div>
        </div>`).join("")}
    </div>
  `;
  document.getElementById("body-form").onsubmit = (e)=>{
    e.preventDefault();
    const entry = {
      date:new Date().toISOString().slice(0,10),
      weight:parseFloat(document.getElementById("bf-weight").value)||0,
      chest:document.getElementById("bf-chest").value,
      waist:document.getElementById("bf-waist").value,
      arms:document.getElementById("bf-arms").value,
      notes:document.getElementById("bf-notes").value
    };
    state.bodyLogs.push(entry);
    saveState();
    syncBodyLogToSheet(entry).catch(()=>{ if(state.google.connected) toast("Saved locally — Sheets sync failed, check Settings"); });
    toast("Entry saved");
    renderProgress();
  };
}
function buildSpark(values){
  const w=300,h=70,pad=8;
  const min=Math.min(...values), max=Math.max(...values);
  const range = (max-min)||1;
  const pts = values.map((v,i)=>{
    const x = pad + (i/(values.length-1))*(w-2*pad);
    const y = h-pad - ((v-min)/range)*(h-2*pad);
    return [x,y];
  });
  const d = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3"/>`).join("");
  return `<path d="${d}"/>${dots}`;
}

function findDefaultWeight(key){
  for(const d of [...Object.values(PROGRAM.foundation.days), ...Object.values(PROGRAM.main.days)]){
    const found = d.list.find(x=>x.key===key);
    if(found && found.weight!==null) return found.weight;
  }
  return 0;
}

/* ---------------------- Google Sign-In + Sheets sync ---------------------- */
let tokenClient = null;
let tokenWaiters = [];

function initGoogle(){
  if(CONFIG.GOOGLE_CLIENT_ID.startsWith("PASTE_")) return;
  if(!window.google || !google.accounts) { setTimeout(initGoogle, 400); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    scope: CONFIG.SHEETS_SCOPE,
    callback: async (resp)=>{
      if(resp.error){
        toast("Google sign-in failed");
        tokenWaiters.forEach(w=>w.reject(new Error(resp.error)));
        tokenWaiters = [];
        return;
      }
      state.google.token = resp.access_token;
      // access tokens are short-lived (usually ~1hr); track expiry so we know when to silently refresh
      state.google.tokenExpiresAt = Date.now() + ((resp.expires_in || 3300) * 1000);
      state.google.connected = true;
      state.google.needsReauth = false;
      saveState();
      tokenWaiters.forEach(w=>w.resolve(resp.access_token));
      tokenWaiters = [];
      if(!state.google.sheetId){ await createLogSheet(); }
      toast("Google Sheets connected");
      if(activeScreen==="settings") renderSettings();
    }
  });
}
function connectGoogle(){
  if(!tokenClient){ toast("Google sign-in still loading, try again in a moment"); return; }
  tokenClient.requestAccessToken({prompt:"consent"});
}
function disconnectGoogle(){
  state.google.connected=false; state.google.token=null; state.google.tokenExpiresAt=null; state.google.needsReauth=false;
  saveState(); renderSettings(); toast("Disconnected");
}

/* Returns a valid access token, silently refreshing in the background if the
   current one is missing or close to expiry. Rejects (rather than popping up
   a sign-in window unprompted) if a silent refresh isn't possible — callers
   should catch this and tell the user to reconnect from Settings. */
function ensureFreshToken(){
  return new Promise((resolve,reject)=>{
    if(state.google.token && state.google.tokenExpiresAt && Date.now() < state.google.tokenExpiresAt - 60000){
      resolve(state.google.token); return;
    }
    if(!tokenClient || !state.google.connected){ reject(new Error("Not connected")); return; }
    let settled = false;
    tokenWaiters.push({
      resolve:(t)=>{ if(!settled){ settled=true; resolve(t); } },
      reject:(e)=>{ if(!settled){ settled=true; reject(e); } }
    });
    tokenClient.requestAccessToken({prompt:""});
    setTimeout(()=>{ if(!settled){ settled=true; reject(new Error("Silent refresh timed out")); } }, 8000);
  });
}

async function gfetch(url, options={}){
  let token;
  try{ token = await ensureFreshToken(); }
  catch(e){ state.google.needsReauth = true; saveState(); throw e; }
  options.headers = Object.assign({}, options.headers, {
    Authorization: "Bearer " + token,
    "Content-Type": "application/json"
  });
  const res = await fetch(url, options);
  if(res.status===401){ state.google.needsReauth = true; saveState(); throw new Error("Google session expired"); }
  if(!res.ok) throw new Error("Google API error " + res.status);
  return res.json();
}

async function createLogSheet(){
  try{
    const created = await gfetch("https://sheets.googleapis.com/v4/spreadsheets", {
      method:"POST",
      body: JSON.stringify({
        properties:{title:"IRONLOG — Workout Data"},
        sheets:[
          {properties:{title:"Workout Log"}},
          {properties:{title:"Body Progress"}},
          {properties:{title:"Current Weights"}}
        ]
      })
    });
    state.google.sheetId = created.spreadsheetId;
    saveState();
    await gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${created.spreadsheetId}/values/Workout Log!A1:J1?valueInputOption=RAW`, {
      method:"PUT", body: JSON.stringify({values:[["Date","Workout","Exercise","Target","Weight (kg)","Set 1 Reps","Set 2 Reps","Set 3 Reps","Weight Increased?","Notes"]]})
    });
    await gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${created.spreadsheetId}/values/Body Progress!A1:G1?valueInputOption=RAW`, {
      method:"PUT", body: JSON.stringify({values:[["Date","Weight (kg)","Chest (in)","Waist (in)","Arms (in)","Photo Taken","Notes"]]})
    });
    await gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${created.spreadsheetId}/values/Current Weights!A1:D1?valueInputOption=RAW`, {
      method:"PUT", body: JSON.stringify({values:[["Exercise","Current Weight (kg)","Next Target (kg)","Last Updated"]]})
    });
  }catch(e){ console.warn("Sheet creation failed", e); toast("Could not create Google Sheet"); }
}

async function syncSessionToSheet(session){
  if(!state.google.connected || !state.google.sheetId) return;
  const rows = session.sets.map(s=>[
    session.date, session.dayLabel, s.exercise, s.target, s.weighted ? s.weight : "bodyweight",
    s.reps[0]||"", s.reps[1]||"", s.reps[2]||"",
    (s.weighted && s.reps.length && s.reps.every(r=>r>=s.repMax) && s.reps.every(r=>r>0)) ? "Y":"N", ""
  ]);
  await gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${state.google.sheetId}/values/Workout Log!A2:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {
    method:"POST", body: JSON.stringify({values: rows})
  });
}
async function syncBodyLogToSheet(entry){
  if(!state.google.connected || !state.google.sheetId) return;
  await gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${state.google.sheetId}/values/Body Progress!A2:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {
    method:"POST", body: JSON.stringify({values:[[entry.date, entry.weight, entry.chest, entry.waist, entry.arms, entry.notes?"":"", entry.notes]]})
  });
}

/* ---------------------- xlsx export ---------------------- */
function exportXlsx(){
  if(typeof XLSX==="undefined"){ toast("Export library still loading, try again"); return; }
  const wb = XLSX.utils.book_new();

  const logRows = [["Date","Workout","Exercise","Target","Weight (kg)","Set 1 Reps","Set 2 Reps","Set 3 Reps","Notes"]];
  state.sessions.forEach(s=>{
    s.sets.forEach(row=>{
      logRows.push([s.date, s.dayLabel, row.exercise, row.target, row.weighted ? row.weight : "bodyweight", row.reps[0]||"", row.reps[1]||"", row.reps[2]||"", ""]);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(logRows), "Workout Log");

  const bodyRows = [["Date","Weight (kg)","Chest (in)","Waist (in)","Arms (in)","Notes"]];
  state.bodyLogs.forEach(l=> bodyRows.push([l.date,l.weight,l.chest,l.waist,l.arms,l.notes]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(bodyRows), "Body Progress");

  const wRows = [["Exercise","Current Weight (kg)"]];
  const seen = new Set();
  [...Object.values(PROGRAM.foundation.days), ...Object.values(PROGRAM.main.days)].forEach(d=>{
    d.list.forEach(exo=>{
      if(exo.weight!==null && !seen.has(exo.key)){
        seen.add(exo.key);
        wRows.push([MOVES[exo.key].name, state.weights[exo.key]!==undefined?state.weights[exo.key]:exo.weight]);
      }
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wRows), "Current Weights");

  XLSX.writeFile(wb, "ironlog-export.xlsx");
  toast("Downloaded ironlog-export.xlsx");
}

function init(){
  applyTheme();
  document.getElementById("btn-theme").onclick = toggleTheme;
  document.getElementById("btn-guide").onclick = openGuide;
  document.querySelectorAll(".nav-btn").forEach(b=> b.onclick = ()=>setScreen(b.dataset.screen));
  setScreen("home");
  initGoogle();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init);
else init();
